<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title description">
<title id="title">White Arabic book page with unvowelled Arabic text</title>
<desc id="description">Close-up of a bright white page from an illustrative Arabic book. The text has no vowel diacritics. Glossa AI selects the sentence العلم نور، والفهم مفتاح الحكمة.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="11"/></filter>
  <clipPath id="bookcrop"><rect x="48" y="12" width="863" height="633" rx="4"/></clipPath>
</defs>
<rect width="960" height="660" fill="#222327"/>
<rect x="42" y="12" width="877" height="648" rx="7" fill="#111" opacity=".6" filter="url(#shadow)"/>
<g clip-path="url(#bookcrop)">
  <rect x="48" y="-45" width="863" height="770" fill="#ffffff"/>
  <rect x="65" y="-30" width="829" height="754" fill="none" stroke="#d6d6d6" stroke-width="1.5"/>
  <rect x="79" y="-18" width="801" height="728" fill="none" stroke="#ededed" stroke-width="1"/>
  <path d="M113 140H850M113 595H850" stroke="#b3b3b3" stroke-width="1"/>
  <g fill="#181818" text-anchor="middle" font-family="Amiri, Noto Naskh Arabic, Noto Sans Arabic, serif" direction="rtl">
    <text x="480" y="94" font-size="46" font-weight="700">في العلم والحكمة</text>
    <text x="480" y="191" font-size="36">إن الكلمة الطيبة تفتح أبواب المعرفة</text>
    <text x="480" y="246" font-size="36">ومع التعلم تتسع آفاق الإنسان</text>
    <text x="480" y="302" font-size="36">وفي كل صفحة تبدأ رحلة جديدة</text>
    <text x="480" y="379" font-size="41" font-weight="700">العلم نور، والفهم مفتاح الحكمة.</text>
    <text x="480" y="454" font-size="36">فاطلب العلم بالصبر والإخلاص</text>
    <text x="480" y="508" font-size="36">ففي المعرفة قوة وفي العمل أثر</text>
    <text x="480" y="565" font-size="35">وليكن قلبك منفتحا لكل فائدة</text>
  </g>
  <text x="480" y="625" font-size="15" text-anchor="middle" fill="#777" font-family="serif">١٢</text>
</g>
<rect x="48" y="12" width="863" height="633" rx="4" fill="none" stroke="#a7a7a7" stroke-width="2"/>
</svg>